         <p class="page-lede">
            <span class="lang-en">Voices from academia, open source, and industry.</span>

      <main class="shell" id="main" style="padding-bottom:var(--movement)">
         <div class="quotes">

            <figure class="quote rise">
               <div class="quote-head">
                  <span class="quote-avatar">
                     <img src="/assets/img/endorsements/leonard-boussioux.jpg" alt="Léonard Boussioux" style="object-position: 50% 20%;">
                  </span>
                  <figcaption>
                     <span class="who"><span class="lang-en">Léonard Boussioux</span><span class="lang-zh" hidden>莱奥纳尔·布西乌（Léonard Boussioux）</span></span>
                     <span class="lang-en">Prof at University of Washington (Foster, Allen CSE) | Harvard LISH affiliate | MIT PhD | GenAI &amp; Operations | ex-Google X, Mila, Berkeley, CentraleSupélec</span>
                     <span class="lang-zh" hidden>华盛顿大学教授（Foster 商学院、Allen 计算机学院）| 哈佛大学 LISH 客座研究员 | MIT 博士 | 生成式 AI 与运筹 | 曾任职 Google X、Mila、伯克利、CentraleSupélec</span>
                  </figcaption>
               </div>
               <blockquote>
                  <span class="lang-en">I had the pleasure of hosting Andy as a guest lecturer for my "Generative AI in the Era of Cloud Computing" course in Spring 2024. Andy's insider perspective and technical expertise on the latest advancements in Generative AI significantly enriched our classroom experience. His contributions extended beyond lectures; he provided invaluable mentorship to students, offering guidance on job searches and emerging tech priorities. Andy's insightful feedback on course projects and active engagement in class discussions were also instrumental in elevating the learning experience. And he helped everyone become AI champions. Many thanks for your contributions!</span>
                  <span class="lang-zh" hidden>2024 年春季，我很荣幸邀请 Andy 担任我《云计算时代的生成式 AI》课程的客座讲师。Andy 以业内人士的视角和对生成式 AI 前沿进展的技术专长，极大地丰富了我们的课堂体验。他的贡献远不止于授课：他为学生提供了宝贵的指导，包括求职建议和新兴技术方向的把握。他对课程项目的深刻反馈以及在课堂讨论中的积极参与，也切实提升了整体学习体验。他还帮助每一位同学成长为 AI 的行家。非常感谢你的贡献！</span>
               </blockquote>
            </figure>

            <figure class="quote rise">
               <div class="quote-head">
                  <span class="quote-avatar">
                     <img src="/assets/img/endorsements/jennifer-madriaga.jpg" alt="Jennifer Madriaga">
                  </span>
                  <figcaption>
                     <span class="who"><span class="lang-en">Jennifer Madriaga</span><span class="lang-zh" hidden>詹妮弗·马德里亚加（Jennifer Madriaga）</span></span>
                     <span class="lang-en">Chief of Staff, The Linux Foundation</span>
                     <span class="lang-zh" hidden>Linux 基金会幕僚长（Chief of Staff）</span>
                  </figcaption>
               </div>
               <blockquote>
                  <span class="lang-en">I know Andy from his community work with open source events like Open Source Summit and AI_Dev where he has served as program committee member. He is a passionate supporter of open source and has independently promoted open source through his outreach to groups like students at the University of Washington Foster School of Business. Andy is approachable and collaborative, and wonderful to work with. I know I can count on Andy to provide support in community endeavors as well as initiate relationships to make open source even stronger. I love that he is receptive to making new connections, and I was able to connect him to projects like GenAI Commons and PyTorch. Andy is truly an asset to open source communities.</span>
                  <span class="lang-zh" hidden>我是通过 Andy 在 Open Source Summit、AI_Dev 等开源活动中担任程序委员会成员的社区工作认识他的。他是开源事业的热忱支持者，还主动向华盛顿大学 Foster 商学院的学生等群体推广开源。Andy 平易近人、乐于协作，是非常出色的合作伙伴。我知道在社区事务中总能得到他的支持，他也会主动牵线搭桥，让开源生态更加强大。我很欣赏他乐于结识新朋友的开放态度，也因此把他引荐给了 GenAI Commons 和 PyTorch 等项目。Andy 是开源社区名副其实的宝贵财富。</span>
               </blockquote>
            </figure>

            <figure class="quote rise">
               <div class="quote-head">
                  <span class="quote-avatar">
                     <img src="/assets/img/endorsements/yi-zhang.jpg" alt="Yi Zhang" style="object-position: 50% 30%;">
                  </span>
                  <figcaption>
                     <span class="who"><span class="lang-en">Yi Zhang</span><span class="lang-zh" hidden>张奕</span></span>
                     <span class="lang-en">Principal Engineer at Intuit Mailchimp, ex-Amazon</span>
                     <span class="lang-zh" hidden>Intuit Mailchimp 首席工程师（Principal Engineer），前亚马逊</span>
                  </figcaption>
               </div>
               <blockquote>
                  <span class="lang-en">For approximately six months, I provided mentoring to Yiming during his tenure as a senior development engineer at Amazon. During our monthly mentoring sessions, Yiming consistently demonstrated a strong grasp of the broader organizational landscape, as well as ability to effectively navigate complex organizational structures. Yiming was cognizant of his organization's overall operations and was proactive in pursuing opportunities that aligned with his career objectives. I am confident that Yiming will successfully attain his goals and aspirations.</span>
                  <span class="lang-zh" hidden>在 Yiming 担任亚马逊高级研发工程师期间，我为他提供了约六个月的导师辅导。在每月的辅导交流中，Yiming 始终展现出对组织全局的敏锐把握，以及在复杂组织架构中高效推进事务的能力。他清楚所在组织的整体运作，并主动争取与自己职业目标相契合的机会。我相信 Yiming 一定能实现他的目标与抱负。</span>
               </blockquote>
            </figure>
