      <script>
         // Return gesture: click the cue or swipe horizontally on the trackpad
         // to slide this page away and go home. (Mouse drags are left alone
         // here so text selection of the recommendations still works.)
         (function() {
            var committed = false;
            function goHome() {
               if (committed) return;
               committed = true;
               document.body.classList.add('leaving');
               setTimeout(function() { window.location.href = '/'; }, 450);
            }
            // Momentum guard: swallow inertia events carried over from the
            // swipe that navigated here; arm only after a 350ms quiet gap.
            var wheelAccum = 0;
            var armed = false;
            var lastHorizWheel = performance.now();
            window.addEventListener('wheel', function(e) {
               if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) { wheelAccum = 0; return; }
               e.preventDefault();
               if (committed) return;
               var now = performance.now();
               if (!armed) {
                  if (now - lastHorizWheel > 350) {
                     armed = true; // fresh, deliberate swipe
                  } else {
                     lastHorizWheel = now; // still momentum: swallow it
                     return;
                  }
               }
               lastHorizWheel = now;
               wheelAccum += e.deltaX;
               if (Math.abs(wheelAccum) > 40) { wheelAccum = 0; goHome(); }
            }, { passive: false });
            var cue = document.getElementById('back-cue');
            if (cue) {
               cue.addEventListener('click', goHome);
               cue.addEventListener('keydown', function(e) {
                  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); }
               });
            }
         })();
      </script>

      <script>

         // Transient GitHub Pages 5xx errors used to leave this section
         // blank until a manual refresh; check status and retry instead.
         function fetchRetry(url, tries) {
            return fetch(url).then(function(r) {
               if (!r.ok) throw new Error(url + ': ' + r.status);
               return r.text();
            }).catch(function(e) {
               if (tries <= 1) throw e;
               return new Promise(function(res) { setTimeout(res, 800); })
                  .then(function() { return fetchRetry(url, tries - 1); });
            });
         }
         // Load the shared recommendations component (same single source of
         // truth as the section on the About page).
         (function() {
           fetchRetry('/components/recommendations-content.html', 3)
             .then(html => {
               const placeholder = document.getElementById('endorsements-content-placeholder');
               if (placeholder) {
                 placeholder.innerHTML = html;
                 // The shared language switcher (loaded with the navbar
                 // component) may have already run before this content was
                 // injected, so re-apply the saved preference here. If the
                 // navbar loads after us, its own call covers this content.
                 if (typeof window.applyGlobalLanguage === 'function') {
                   var lang = 'en';
                   try { lang = localStorage.getItem('preferredLanguage') || 'en'; } catch (e) {}
                   window.applyGlobalLanguage(lang);
                 }
               }
             });
         })();
