      <style>
         /* An immersive page: it deliberately does not load shell.css. The
            wall is always dark, and the only chrome is a way back and a
            counter. */
         :root {
            --bg: #101010;
            --ink: #ece7df;
            --ink-2: #a39d92;
            --rule: #2a2a2a;
            --serif: "Source Serif 4", Georgia, serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         }

         * { box-sizing: border-box; }

         html { scroll-behavior: smooth; }

         body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--serif);
            -webkit-font-smoothing: antialiased;
         }

         a { color: inherit; }

         /* ---- chrome ---------------------------------------------------- */

         .chrome {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 20px clamp(20px, 3vw, 44px);
            font-family: var(--sans);
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            mix-blend-mode: difference;
            color: #fff;
         }

         .chrome a { text-decoration: none; opacity: 0.85; }
         .chrome a:hover { opacity: 1; }

         /* ---- hero ------------------------------------------------------ */

         .hero {
            position: relative;
            height: 100svh;
            overflow: hidden;
            display: grid;
            place-items: end start;
         }

         .hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: 50% 40%;
            animation: drift 26s ease-in-out infinite alternate;
            filter: brightness(0.82);
         }

         @keyframes drift {
            from { transform: scale(1); }
            to   { transform: scale(1.07); }
         }

         .hero-text {
            position: relative;
            z-index: 1;
            padding: clamp(28px, 5vw, 72px);
            max-width: 30ch;
         }

         .hero-text .eyebrow {
            font-family: var(--sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin: 0 0 14px;
         }

         .hero-text h1 {
            font-size: clamp(2.6rem, 7vw, 5.2rem);
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.01em;
            margin: 0;
         }

         .hero-text p {
            font-size: clamp(1rem, 1.4vw, 1.15rem);
            line-height: 1.55;
            color: var(--ink-2);
            margin: 18px 0 0;
         }

         /* ---- the wall: 25 true squares, edge to edge ------------------- */
         /* Full-bleed and square at once: five 20vw squares per row, so the
            wall is a 100vw x 100vw plane the page scrolls through. */

         .wall {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
         }

         .wall li {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #1a1a1a;
         }

         .wall img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.001);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
            filter: saturate(0.92) brightness(0.96);
         }

         .wall li:hover img {
            transform: scale(1.045);
            filter: saturate(1) brightness(1);
         }

         /* staggered reveal: each tile carries its own delay via --i */
         .wall li {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: calc(var(--i) * 45ms);
         }

         .wall.in li {
            opacity: 1;
            transform: none;
         }

         /* ---- coda ------------------------------------------------------ */

         .coda {
            text-align: center;
            padding: clamp(70px, 10vh, 140px) 24px;
         }

         .coda p {
            font-size: 1.05rem;
            color: var(--ink-2);
            margin: 0 0 26px;
         }

         .coda a {
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--rule);
            border-radius: 999px;
            padding: 12px 26px;
            transition: border-color 0.2s ease;
         }

         .coda a:hover { border-color: var(--ink-2); }

         @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .hero img { animation: none; }
            .wall li { opacity: 1; transform: none; transition: none; }
            .wall li:hover img { transform: none; }
         }
      </style>
   </head>
   <body>
      <nav class="chrome" aria-label="Page">

      <script>
         // Reveal the wall once it enters the viewport; tiles stagger via the
         // per-tile --i delay. Without IntersectionObserver the wall is simply
         // visible (reduced motion is handled in CSS).
         (function () {
            var wall = document.querySelector(".wall");
            if (!("IntersectionObserver" in window)) {
               wall.classList.add("in");
               return;
            }
            var io = new IntersectionObserver(function (entries) {
               entries.forEach(function (e) {
                  if (e.isIntersecting) {
                     wall.classList.add("in");
                     io.disconnect();
                  }
               });
            }, { threshold: 0.15 });
            io.observe(wall);
         })();
      </script>
