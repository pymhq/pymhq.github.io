      <script>

         // Transient GitHub Pages 5xx errors used to leave this section
         // blank until a manual refresh; check status and retry instead.
         function fetchRetry(url, tries) {
            return fetch(url).then(function(r) {
               if (!r.ok) throw new Error(url + ': ' + r.status);
               return r.text();
            }).catch(function(e) {
               if (tries <= 1) throw e;
               return new Promise(function(res) { setTimeout(res, 800); })
                  .then(function() { return fetchRetry(url, tries - 1); });
            });
         }
         // Load news content directly
         (function() {
           // First create the card structure (without title to avoid duplication with page title)
           const placeholder = document.getElementById('news-placeholder');
           if (placeholder) {
             placeholder.innerHTML = `
               <div class="card mt-3 p-3">
                 <div id="news-content-placeholder"></div>
               </div>
             `;

             // Then load the actual content
             fetchRetry('/components/news-content.html', 3)
               .then(html => {
                 const contentPlaceholder = document.getElementById('news-content-placeholder');
                 if (contentPlaceholder) {
                   contentPlaceholder.innerHTML = html;
                 }
               });
           }
         })();
      </script>
