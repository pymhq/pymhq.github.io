<!DOCTYPE html>

<!--
  ============================================================================
  BLOG POST TEMPLATE  (copy to blog/<YEAR>/<slug>/index.html)
  ----------------------------------------------------------------------------
  Bilingual (EN / 中文) post scaffold with word count + read time baked in.

  HOW TO USE — replace the ALL_CAPS placeholders:
    BLOG_TITLE_EN / BLOG_TITLE_ZH   post title in each language
    POST_SLUG                       url slug, e.g. french-riviera
    YEAR                            e.g. 2026
    OG_DESCRIPTION                  1-line summary for social cards
    OG_IMAGE_URL                    https://pengandy.com/assets/blog/POST_SLUG/hero.jpg
    POST_DATE_EN / POST_DATE_ZH     e.g. "July 2, 2026" / "2026 年 7 月 2 日"
    WORD_COUNT / READ_MIN           fill after writing; the blog index card is
                                    auto-synced by scripts/sync_reading_stats.py
    TAGS_AND_CATEGORIES             the <a> tag/category links row

  NOTES
    • Single-language post? Keep only the .lang-en block, delete the toggle,
      the .lang-zh block, and the <script> at the bottom.
    • PERSON NAMES: always wrap in <em>italic</em> — never <strong>bold</strong>.
    • DO NOT bold (<strong>) ANY content unless the author explicitly asks for it.
      Default to plain text; use <em>italic</em> only for names/light emphasis.
    • After publishing run:  python3 scripts/sync_reading_stats.py   (sync index from post metas)
                             python3 scripts/check_reading_stats.py  (verify consistency)
                             python3 scripts/generate_feed.py
    • The EN/中文 toggle works because the button sets `body.zh`, and the CSS
      below hides the inactive language. Wrap the <h1> and <p class="post-meta">
      in .lang-en / .lang-zh spans so the header switches too.
  ============================================================================
-->

   <style>

     /* --- EN / 中文 language toggle ---
        Clicking either button here updates the SAME global preference
        (localStorage 'preferredLanguage') used by the homepage and the
        navbar, so navigating away or the already-rendered navbar both
        reflect the choice immediately. See __setPostLang() below. */
     .lang-toggle { margin: 0 0 22px 0; }
     .lang-toggle button { border:1px solid var(--global-theme-color); background:transparent; color:var(--global-theme-color);

      <!-- Scripts -->
      <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js" integrity="sha256-fgLAgv7fyCGopR/gBNq2iW3ZKIdqIcyshnUULC4vex8=" crossorigin="anonymous"></script>

      <!-- EN / 中文 toggle logic. This writes the SAME global preference
           (localStorage 'preferredLanguage') that the homepage button and
           components/navbar.html use, so switching here also updates the
           navbar immediately, without a page reload. -->
      <script>
      (function(){
        function showEl(el) {
          var tag = el.tagName;
          el.style.display = (tag === 'SPAN') ? 'inline' : 'block';
        }
        function applyHere(lang) {
          var zh = lang === 'zh';
          document.querySelectorAll('.lang-en, .lang-zh').forEach(function(el){ el.style.display = 'none'; });
          if (zh) {
            document.querySelectorAll('.lang-zh').forEach(showEl);
            // Fallback: no Chinese translation on this page/block -> keep English.
            document.querySelectorAll('.lang-en').forEach(function(el){
              var parent = el.parentElement;
              var hasZhSibling = parent && parent.querySelector('.lang-zh');
              if (!hasZhSibling) { showEl(el); }
            });
          } else {
            document.querySelectorAll('.lang-en').forEach(showEl);
          }
          var be = document.getElementById('lang-en-btn'), bz = document.getElementById('lang-zh-btn');
          if (be) be.classList.toggle('active', !zh);
          if (bz) bz.classList.toggle('active', zh);
        }

        function setLang(lang) {
          try { localStorage.setItem('preferredLanguage', lang); } catch(e) {}
          applyHere(lang);
          // Also refresh the navbar (and any other .lang-en/.lang-zh markup
          // outside this post) if it has already finished loading.
          if (typeof window.applyGlobalLanguage === 'function') {
            window.applyGlobalLanguage(lang);
          }
        }
        window.__setPostLang = setLang;

        var initial = 'en';
        try { initial = localStorage.getItem('preferredLanguage') || 'en'; } catch(e) {}
        applyHere(initial);
      })();
      </script>
