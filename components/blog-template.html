<!DOCTYPE html>

<!--
  ============================================================================
  BLOG POST TEMPLATE  (copy to blog/<YEAR>/<slug>/index.html)
  ----------------------------------------------------------------------------
  Bilingual (EN / 中文) post scaffold with word count + read time baked in.

  HOW TO USE — replace the ALL_CAPS placeholders:
    BLOG_TITLE_EN / BLOG_TITLE_ZH   post title in each language
    POST_SLUG                       url slug, e.g. french-riviera
    YEAR                            e.g. 2026
    OG_DESCRIPTION                  1-line summary for social cards
    OG_IMAGE_URL                    https://pengandy.com/assets/blog/POST_SLUG/hero.jpg
    POST_DATE_EN / POST_DATE_ZH     e.g. "July 2, 2026" / "2026 年 7 月 2 日"
    WORD_COUNT / READ_MIN           fill after writing; the blog index card is
                                    auto-synced by scripts/sync_reading_stats.py
    TAGS_AND_CATEGORIES             the <a> tag/category links row

  NOTES
    • Single-language post? Keep only the .lang-en block, delete the toggle,
      the .lang-zh block, and the <script> at the bottom.
    • PERSON NAMES: always wrap in <em>italic</em> — never <strong>bold</strong>.
    • DO NOT bold (<strong>) ANY content unless the author explicitly asks for it.
      Default to plain text; use <em>italic</em> only for names/light emphasis.
    • LINKS IN PROSE: links embedded mid-sentence stay PLAIN <a> (site default
      blue, underline on hover) — do not decorate them; pills mid-sentence look
      jarring. Reserve <a class="post-hl"> (pill style in the CSS below) for a
      standalone call-to-action at the end of a paragraph, e.g.
      "learn more in my other blog post &rarr;". The pill SHAPE is fixed; the
      accent COLOR may vary per article — override --hl-color in the post's own
      <style>. Default is the site theme blue (--global-theme-color). Apply the
      same treatment in BOTH the EN and 中文 versions. (Legacy: ant-hl in
      blog/2026/curiosity-driven-builder/ is this same pill style.)
    • The EN/中文 toggle works because the button sets `body.zh`, and the CSS
      below hides the inactive language. Wrap the <h1> and <p class="post-meta">
      in .lang-en / .lang-zh spans so the header switches too.

  ============================================================================
  PUBLISH CHECKLIST — every page/file to touch for ONE new post
  ----------------------------------------------------------------------------
  The site is fully static; nothing regenerates listing pages for you.
  Work through ALL of these, in order:

  1. POST PAGE — blog/<YEAR>/<slug>/index.html  (this template)

  2. OG CARD (new minimal style — full SOP in /OG-CARD-SOP.md):
       • The card is EITHER pure text OR a pure image — never a mix of
         text overlaid on / combined with imagery.
       • cp assets/blog/2026/speculativedecoding/og-card.html \
            assets/blog/<year>/<slug>/og-card.html
       • Edit ONLY two spots: <h1> hook (first line class="accent" = number /
         counter-intuitive claim; second line ink) and .sub (<b>names</b> +
         one line on what the reader would miss). NO page title, NO author,
         NO domain, NO "Puget Sound Journal". White bg; ink #16181d + site
         blue #0076df only; sub #3c4148; serif = Source Serif 4.
       • Render 3x PNG with headless Chrome (--window-size=1200,630
         --force-device-scale-factor=3 --virtual-time-budget=8000);
         verify with sips: expect 3600 × 1890.
       • Point og:image + twitter:image in the post <head> at the ABSOLUTE
         URL: https://pengandy.com/assets/blog/<year>/<slug>/og-card.png
       • Commit og-card.html + og-card.png together with the post.

  3. BLOG INDEX — blog/index.html:
       • Add the post card <li> at the top of the post list (title EN/ZH,
         description, date, readstats, tags/category links — same links as
         the post's own .post-tags row).
       • Update the tag cloud: NEW tag → add a `tc-chip tc-one` chip
         (alphabetical); EXISTING tag → bump its <span class="tc-count">
         (a tc-one chip gaining a 2nd post gets a count span; promote to
         `tc-hot` only for the top few). Same for the category chip counts.
       • If the first page is over its card budget, move the oldest card
         to blog/page/2/index.html.

  4. PAGE 2 — blog/page/2/index.html:
       • Its tag/category cloud is a COPY of the index cloud — apply the
         exact same cloud edits there.

  5. YEAR ARCHIVE — blog/archive/<YEAR>/index.html: add the same post card.
       • The calendar chip in every .post-tags row links here:
         <a href="/blog/archive/<YEAR>/"> (NOT /blog/<YEAR>/ — that URL
         belongs to the year's Recap ARTICLE, e.g. /blog/2025/ = 2025 Recap).
       • First post of a new year? Create the archive page first — copy
         blog/archive/2026/index.html as the base.

  6. TAG PAGES — for EACH tag on the post:
       • Existing tag: add the post card to blog/tag/<tag>/index.html.
       • New tag: mkdir blog/tag/<tag>/ and copy an existing single-tag
         page (e.g. blog/tag/mlsys/index.html) as the base, then add the
         chip to BOTH clouds (steps 3 & 4).

  7. CATEGORY PAGE — blog/category/<cat>/index.html: add the post card.

  8. SCRIPTS (run from repo root, commit results):
       python3 scripts/sync_reading_stats.py    # sync index card readstats
       python3 scripts/check_reading_stats.py   # verify consistency
       python3 scripts/generate_feed.py         # regenerate feed.xml

  9. AFTER PUSHING — run the post URL through the LinkedIn Post Inspector
     (https://www.linkedin.com/post-inspector/) to refresh the cache and
     preview the real card before sharing.

  CONSISTENCY RULE: the tag/category links on the post page, its card on
  every listing page (index / page 2 / year / tag / category), the two tag
  clouds, and feed.xml must all agree.

  TAG CHECK — MANDATORY on EVERY post update or new post:
    • Diff the post's .post-tags row against blog/tag/: any tag without a
      blog/tag/<slug>/index.html is NEW → create its page AND add its chip
      to BOTH clouds (blog/index.html + blog/page/2/index.html).
    • Verify the chip really is in the CLOUD block (class="tc-chip"), not
      just in a post card's tag row — grep 'tc-chip.*<slug>' in both files.
      (A card link is NOT a cloud chip; they are easy to conflate.)
    • Naming: URL slug is hyphenated (reinforcement-learning); the DISPLAY
      label always uses spaces (reinforcement learning) — on the post page,
      on every card, and on the chip.
-->

      <!-- EN / 中文 toggle logic. This writes the SAME global preference
           (localStorage 'preferredLanguage') that the homepage button and
           components/navbar.html use, so switching here also updates the
           navbar immediately, without a page reload. -->
      <script>
      (function(){
        function showEl(el) {
          var tag = el.tagName;
          el.style.display = (tag === 'SPAN') ? 'inline' : 'block';
        }
        function applyHere(lang) {
          var zh = lang === 'zh';
          document.querySelectorAll('.lang-en, .lang-zh').forEach(function(el){ el.style.display = 'none'; });
          if (zh) {
            document.querySelectorAll('.lang-zh').forEach(showEl);
            // Fallback: no Chinese translation on this page/block -> keep English.
            document.querySelectorAll('.lang-en').forEach(function(el){
              var parent = el.parentElement;
              var hasZhSibling = parent && parent.querySelector('.lang-zh');
              if (!hasZhSibling) { showEl(el); }
            });
          } else {
            document.querySelectorAll('.lang-en').forEach(showEl);
          }
          var be = document.getElementById('lang-en-btn'), bz = document.getElementById('lang-zh-btn');
          if (be) be.classList.toggle('active', !zh);
          if (bz) bz.classList.toggle('active', zh);
        }

        function setLang(lang) {
          try { localStorage.setItem('preferredLanguage', lang); } catch(e) {}
          applyHere(lang);
          // Also refresh the navbar (and any other .lang-en/.lang-zh markup
          // outside this post) if it has already finished loading.
          if (typeof window.applyGlobalLanguage === 'function') {
            window.applyGlobalLanguage(lang);
          }
        }
        window.__setPostLang = setLang;

        var initial = 'en';
        try { initial = localStorage.getItem('preferredLanguage') || 'en'; } catch(e) {}
        applyHere(initial);
      })();
      </script>
