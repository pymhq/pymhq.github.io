<div class="card mt-3 p-3">
   <h3 class="card-title font-weight-medium">Service</h3>
   <div id="service-content-placeholder"></div>
</div>
<script>

         // Transient GitHub Pages 5xx errors used to leave this section
         // blank until a manual refresh; check status and retry instead.
         function fetchRetry(url, tries) {
            return fetch(url).then(function(r) {
               if (!r.ok) throw new Error(url + ': ' + r.status);
               return r.text();
            }).catch(function(e) {
               if (tries <= 1) throw e;
               // fast first retry (300ms), longer second (600ms)
               return new Promise(function(res) { setTimeout(res, (4 - tries) * 300); })
                  .then(function() { return fetchRetry(url, tries - 1); });
            });
         }
   // Load core service content
   fetchRetry('/components/service-content.html', 3)
      .then(html => {
         const placeholder = document.getElementById('service-content-placeholder');
         if (placeholder) {
            placeholder.innerHTML = html;
         }
      });
</script>
