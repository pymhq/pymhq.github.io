<style>
// Navbar customization

.navbar {
  box-shadow: none;
  border-bottom: 1px solid var(--global-divider-color);
  background-color: rgba(255, 255, 255, 0.8) !important;
  backdrop-filter: blur(10px);
  opacity: 0.95;
}

.navbar .dropdown-menu {
  background-color: var(--global-bg-color);
  border: 1px solid var(--global-divider-color);

  a:not(.active) {
    color: var(--global-text-color);
  }

  a:hover {
    color: var(--global-hover-color);
  }

  .dropdown-divider {
    border-top: 1px solid var(--global-divider-color) !important;
  }
}

.dropdown-item {
  color: var(--global-text-color);

  &:hover {
    color: var(--global-hover-color);
    background-color: var(--global-bg-color);
  }
}

.navbar.navbar-light {
  a {
    &:hover {
      text-decoration: none;
    }
  }

  .navbar-brand {
    color: var(--global-text-color);
  }

  .navbar-nav .nav-item .nav-link {
    color: var(--global-text-color);

    &:hover {
      color: var(--global-hover-color);
    }
  }

  .navbar-nav .nav-item.active>.nav-link {
    background-color: inherit;
    font-weight: bolder;
    color: var(--global-theme-color);

    // See assets/css/main.css / _sass/_base.scss for why this is needed:
    // nav link text is wrapped in <span class="lang-en/lang-zh">, and a
    // global span color-reset rule overrides the inherited active color
    // unless we target the span explicitly here.
    span {
      color: var(--global-theme-color);
    }

    &:hover {
      color: var(--global-hover-color);
    }
  }

  .navbar-brand.social {
    padding-bottom: 0;
    padding-top: 0;
    font-size: 1.7rem;

    a {
      i::before {
        color: var(--global-text-color);
        transition-property: all 0.2s ease-in-out;
      }

      &:hover {
        i::before {
          color: var(--global-theme-color);
        }
      }
    }
  }
}

.navbar-toggler {
  .icon-bar {
    display: block;
    width: 22px;
    height: 2px;
    background-color: var(--global-text-color);
    border-radius: 1px;
    margin-bottom: 4px;
    transition: all 0.2s;
  }

  .top-bar {
    transform: rotate(45deg);
    transform-origin: 10% 10%;
  }

  .middle-bar {
    opacity: 0;
  }

  .bottom-bar {
    transform: rotate(-45deg);
    transform-origin: 10% 90%;
  }
}

.navbar-toggler.collapsed {
  .top-bar {
    transform: rotate(0);
  }

  .middle-bar {
    opacity: 1;
  }

  .bottom-bar {
    transform: rotate(0);
  }
}

#light-toggle {
  padding: 0;
  border: 0;
  background-color: inherit;
  color: var(--global-text-color);

  &:hover {
    color: var(--global-hover-color);
  }
}

progress {
  /* Positioning */
  position: fixed;
  left: 0;
  top: 56px;
  z-index: 10;

  /* Dimensions */
  width: 100%;
  height: 1px;

  /* Reset the appearance */
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;

  /* Get rid of the default border in Firefox/Opera. */
  border: none;

  /* Progress bar container for Firefox/IE10  */
  background-color: transparent;

  /* Progress bar value for IE10  */
  color: var(--global-theme-color);
}

progress::-webkit-progress-bar {
  background-color: transparent;
}

progress::-webkit-progress-value {
  background-color: var(--global-theme-color);
}

progress::-moz-progress-bar {
  background-color: var(--global-theme-color);
}

.progress-container {
  width: 100%;
  background-color: transparent;
  z-index: 10;
  position: fixed;
  top: 56px;
  left: 0;
  height: 5px;
  display: block;
}

.progress-bar {
  background-color: var(--global-theme-color);
  width: 0%;
  display: block;
  height: inherit;
}

// Rouge Color Customization
figure.highlight {
  margin: 0 0 1rem;
}

pre {
  color: var(--global-theme-color);
  background-color: var(--global-code-bg-color);
  border-radius: 6px;
  padding: 6px 12px;

  pre,
  code {
    background-color: transparent;
    border-radius: 0;
    margin-bottom: 0;
    padding: 0;
  }
}

code {
  color: var(--global-theme-color);
  background-color: var(--global-code-bg-color);
  border-radius: 3px;
  padding: 3px 3px;
}

// Transitioning Themes
html.transition,
html.transition *,
html.transition *:before,
html.transition *:after {
  transition: all 750ms !important;
  transition-delay: 0 !important;
}

// Extra Markdown style (post Customization)
.post {
  .post-meta {
    color: var(--global-text-color-light);
    font-size: 0.875rem;
    margin-bottom: 0;
  }

  .post-tags {
    color: var(--global-text-color-light);
    font-size: 0.875rem;
    padding-top: 0.25rem;
    padding-bottom: 1rem;

    a {
      color: var(--global-text-color-light);
      text-decoration: none;

      &:hover {
        color: var(--global-theme-color);
      }
    }
  }

  .post-content {
    blockquote {
      border-left: 5px solid var(--global-theme-color);
      padding: 8px;

      p {
        margin-bottom: 0;
      }
    }
  }
}

/* Copy button */
.code-display-wrapper {
  position: relative;

  .copy {
    background: var(--global-card-bg-color);
    border-color: var(--global-bg-color);
    border-radius: .3rem;
    border-style: none;
    color: var(--global-text-color);
    font-size: medium;
    opacity: 0;
    position: absolute;
    right: .5rem;
    top: .5rem;
  }

  &:active .copy,
  &:focus .copy,
  &:hover .copy {
    color: var(--global-hover-color);
    opacity: 1;
  }
}

.btn-group.dropdown {
  .btn {
    box-shadow: none;
    -webkit-box-shadow: none;
  }

  .btn-secondary.dropdown-toggle {
    border: 1px solid var(--global-divider-color);

    .page-size {
      color: inherit;
    }

    &:not(.active) {
      background-color: var(--global-bg-color) !important;
      color: var(--global-text-color);
    }

    &:hover {
      background-color: var(--global-hover-color) !important;
      color: var(--global-hover-text-color) !important;
    }
  }

  .dropdown-menu {
    background-color: var(--global-bg-color);
  }

  .dropdown-item {
    background-color: var(--global-bg-color);
    color: var(--global-text-color);

    &:hover {
      color: var(--global-hover-color);
    }
  }

  .dropdown-item.active, .dropdown-item:active {
    background-color: var(--global-hover-color);
    color: var(--global-hover-text-color) !important;

    &:hover {
      color: var(--global-hover-text-color);
    }
  }
}

/* Table of Contents */
nav[data-toggle="toc"] {
  top: 5rem;

  .nav .nav>li>a {
    font-size: .75rem;
  }

  .nav>li>a {
    color: var(--global-text-color);
    font-size: .75rem;

    &:hover {
      color: var(--global-hover-color);
      border-left-color: var(--global-hover-color);
    }
  }

  .nav-link.active {
    color: var(--global-theme-color);
    border-left-color: var(--global-theme-color);
    font-size: .75rem;

    &:hover {
      color: var(--global-hover-color);
      border-left-color: var(--global-hover-color);
    }
  }
}

/* small screens */
@media (max-width: 576px) {
  /* override stickyness so that the navigation does not follow scrolling */
  nav[data-toggle="toc"] {
    visibility: hidden;
    height: 0;
    top: 0;
  }
}

<!-- Global site-wide language state (chosen once on the homepage, applied everywhere).
     Shows .lang-zh content when preferredLanguage is 'zh'; falls back to English
     for any block that has no .lang-zh translation, instead of leaving it blank. -->
<script>
(function() {
   // IMPORTANT: setting el.style.display = '' only clears the inline
   // override and lets CSS take over again. Since main.css has a global
   // ".lang-zh { display: none; }" default (so text isn't stacked before
   // JS runs), clearing back to '' would immediately re-hide it. We must
   // set an explicit display value instead, picked by tag type so inline
   // spans stay inline and block-level containers stay block.
   function showEl(el) {
      var tag = el.tagName;
      el.style.display = (tag === 'SPAN') ? 'inline' : 'block';
   }
   // Chinese titles for pages that rely on this shared, global language
   // switcher (i.e. don't define their own applyLanguage()). Keyed by the
   // <body data-page="..."> attribute already used to highlight the active
   // nav item, and kept in sync with the nav labels in this same file.
   // Chinese titles for pages that rely on this shared, global language
   // switcher (i.e. don't define their own applyLanguage()). Keyed by the
   // <body data-page="..."> attribute already used to highlight the active
   // nav item, and kept in sync with the nav labels in this same file.
   //
   // NOTE: excludes "blog" — data-page="blog" is shared by the blog listing
   // AND every individual post, each with its own unique <title>, so it
   // can't be mapped to one generic string here. The blog listing page's
   // title is translated directly in blog/index.html instead.
   var zhTitles = {
      bio: '关于',
      publication: '发表',
      publications: '书籍 & 邀请演讲',
      projects: '项目',
      services: '服务',
      resume: '简历',
      news: '新闻'
   };

   function applyGlobalLanguage(lang) {
      document.querySelectorAll('.lang-en, .lang-zh').forEach(function(el) {
         el.style.display = 'none';
      });
      if (lang === 'zh') {
         document.querySelectorAll('.lang-zh').forEach(showEl);
         document.querySelectorAll('.lang-en').forEach(function(el) {
            var parent = el.parentElement;
            var hasZhSibling = parent && parent.querySelector('.lang-zh');
            if (!hasZhSibling) {
               showEl(el);
            }
         });
         document.body.classList.add('zh');
         var currentPage = document.body.getAttribute('data-page');
         if (currentPage && zhTitles[currentPage] && !document.body.hasAttribute('data-title-en')) {
            document.body.setAttribute('data-title-en', document.title);
            document.title = zhTitles[currentPage];
         }
      } else {
         document.querySelectorAll('.lang-en').forEach(showEl);
         document.body.classList.remove('zh');
         var savedTitle = document.body.getAttribute('data-title-en');
         if (savedTitle) {
            document.title = savedTitle;
         }
      }
   }
   window.applyGlobalLanguage = applyGlobalLanguage;

   // Shared entry point: any page (homepage button, a blog post's own
   // toggle button, etc.) can call switchLanguage('zh'|'en') to update the
   // site-wide preference. This re-applies language to the navbar AND the
   // current page's content immediately, without a reload.
   window.switchLanguage = function(lang) {
      try { localStorage.setItem('preferredLanguage', lang); } catch (e) {}
      applyGlobalLanguage(lang);
   };

   var preferredLang = 'en';
   try { preferredLang = localStorage.getItem('preferredLanguage') || 'en'; } catch (e) {}
   applyGlobalLanguage(preferredLang);
})();
</script>
