<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ============================================================
     Social preview card — 1200×630, PURE TEXT edition.
     Per template rule: the OG card is EITHER pure text OR a pure
     image. This one is the article's thesis phrase, set in the
     site's flagship language: one accent tick + serif display,
     with the open/closed split rendered as a typographic pair.
     No author / domain — the platforms render those.
     Render: headless Chrome, --force-device-scale-factor=3.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fff; display: flex; align-items: center; justify-content: center;
         -webkit-font-smoothing: antialiased; }
  .wrap { width: 1000px; }
  .tick { width: 72px; height: 7px; border-radius: 4px; background: #0076df; margin-bottom: 42px; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700;
       font-size: 128px; line-height: 1.04; letter-spacing: -0.018em; color: #1a1a1a; }
  h1 .open { color: #0076df; }
  .vs { margin-top: 40px; font-family: 'Source Serif 4', Georgia, serif; font-style: italic;
        font-size: 34px; color: #5f6672; }
  .vs .o { color: #0076df; font-style: normal; font-weight: 600; }
  .vs .c { color: #1a1a1a; font-style: normal; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tick"></div>
    <h1><span class="open">Open</span> Intelligence</h1>
    <div class="vs"><span class="o">open</span> vs <span class="c">closed</span> — and why the answer is an ecosystem</div>
  </div>
</body>
</html>
