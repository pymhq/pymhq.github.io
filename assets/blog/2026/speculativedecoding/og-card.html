<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ============================================================
     Social preview card — 1200×630, click-hook edition.
     Hook = the article's most counterintuitive claim:
     "5× faster. Zero quality loss." Names create curiosity;
     the token row garnish ties it to the article's design.
     Page title + domain are rendered by LinkedIn/Twitter below
     the image, so neither is repeated here.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
  :root {
    --accent: #0076df;
    --amber: #b45309;
    --ink: #16181d;
    --sub: #3c4148;
    --hair: rgba(128, 128, 128, .38);
    --hair-faint: rgba(128, 128, 128, .2);
    --serif: "Source Serif 4", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff; color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: var(--serif); font-weight: 700;
    font-size: 108px; line-height: 1.08; letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--accent); }

  .sub {
    font-size: 30px; font-weight: 500; line-height: 1.45; color: var(--sub);
    margin-top: 34px; max-width: 950px;
  }
  .sub b { font-weight: 700; color: var(--ink); }
  .sub .dot { opacity: .45; margin: 0 10px; }

</style>
</head>
<body>

  <h1><span class="accent">5× faster.</span><br>Zero quality loss.</h1>

  <p class="sub"><b>Gemma&nbsp;4</b><span class="dot">·</span><b>DeepSeek DSpark</b> — how the field converged on speculative decoding in eight weeks.</p>

</body>
</html>
