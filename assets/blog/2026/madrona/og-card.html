<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Social preview card, 1200x630, in the contact card's language: white paper,
     Source Serif 4 at weight 400 for display type, --ink-3 eyebrow, no colour.
     The logo is Madrona's own vertical lockup (tree and wordmark), in its brand green. Render at 1x: --force-device-scale-factor=1. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
  :root {
    --ink: #16181d;
    --ink-3: #6b7280;
    --paper: #ffffff;
    --rule: rgba(22, 24, 29, .18);
    --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    display: flex; align-items: center; gap: 64px;
    padding: 0 96px; -webkit-font-smoothing: antialiased;
  }
  .logo { display: block; height: 290px; width: auto; flex: none; }
  .rule { width: 1px; height: 220px; background: var(--rule); flex: none; }
  .eyebrow {
    font-size: 17px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .eyebrow { margin-top: 30px; }
  .eyebrow .sep { opacity: .55; margin: 0 11px; }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 88px; line-height: 1.06; letter-spacing: -.02em;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <img class="logo" src="madrona-logo.png" alt="Madrona">
  <div class="rule"></div>
  <div>
    <h1>IA40<br>Summit 2026</h1>
    <div class="eyebrow">Four Seasons Hotel<span class="sep">·</span>Seattle</div>
  </div>

</body>
</html>
