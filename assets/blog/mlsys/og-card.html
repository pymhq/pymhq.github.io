<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ============================================================
     Social preview card — 1200×630, click-hook edition.
     Same design language as curiosity-driven-builder/og-card.html:
     pure text, Source Serif 4, theme-blue accent.
     Hook = the post's loudest theme (paper group 1, both ORALs).
     Page title + domain are rendered by LinkedIn/Twitter below
     the image, so "MLSys 2026" is not repeated here.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
  :root {
    --accent: #0076df;
    --ink: #16181d;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fff; color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 96px;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: var(--serif); font-weight: 700;
    font-size: 96px; line-height: 1.18; letter-spacing: -0.02em;
    text-align: center;
  }
  h1 .accent { color: var(--accent); font-size: 150px; }
</style>
</head>
<body>

  <h1><span class="accent">RL +</span><br>Speculator.</h1>

</body>
</html>
