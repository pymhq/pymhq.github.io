<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" role="img" aria-label="ADA access journey map at Seattle Stadium, drawn north-up: Accessible Match Day Shuttle Station, to the stadium ADA drop-off, to the stadium entrance, to my seat on the north (Cascade) sideline of the lower bowl, right of midfield.">
  <defs>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="45%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#e0559b"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dfe6ef"/>
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fa34d"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
    <marker id="arrEntry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd6"/>
    </marker>
    <marker id="arrExit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0559b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="980" height="680" rx="16" fill="#f7f9fc"/>
  <rect x="0.5" y="0.5" width="979" height="679" rx="16" fill="none" stroke="rgba(120,110,200,0.28)"/>

  <!-- title -->
  <text x="34" y="42" font-size="21" font-weight="700" fill="#2b2b3a">ADA Access Journey · Seattle Stadium</text>
  <text x="34" y="64" font-size="12.5" fill="#8a8a9a">FIFA World Cup 2026™ · Belgium 3–2 Senegal · Round of 32 · Jul 1, 2026</text>

  <!-- ===================== CONNECTORS (drawn first, under cards) ===================== -->
  <!-- ENTRY solid: 1 -> 2 -> 3 -> 4 -->
  <path d="M254 140 L 372 140" fill="none" stroke="#2f6fd6" stroke-width="3.4" marker-end="url(#arrEntry)"/>
  <text x="313" y="130" font-size="11" fill="#2f6fd6" text-anchor="middle" font-weight="600">① accessible shuttle</text>
  <path d="M612 140 L 712 140" fill="none" stroke="#2f6fd6" stroke-width="3.4" marker-end="url(#arrEntry)"/>
  <text x="662" y="130" font-size="11" fill="#2f6fd6" text-anchor="middle" font-weight="600">② escort</text>
  <path d="M800 186 C 742 300, 650 372, 552 410" fill="none" stroke="#2f6fd6" stroke-width="3.4" marker-end="url(#arrEntry)"/>
  <text x="712" y="300" font-size="11" fill="#2f6fd6" text-anchor="middle" font-weight="600">③ to seat</text>

  <!-- EXIT dashed: 4 -> 2 -> 1 -->
  <path d="M522 410 C 508 340, 502 258, 500 200" fill="none" stroke="#e0559b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrExit)"/>
  <path d="M380 166 C 330 166, 300 166, 262 166" fill="none" stroke="#e0559b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrExit)"/>

  <!-- ===================== NODE 1 ===================== -->
  <g filter="url(#soft)">
    <rect x="34" y="92" width="220" height="98" rx="12" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.4"/>
    <path d="M34 104 a12 12 0 0 1 12 -12 h24 v98 h-24 a12 12 0 0 1 -12 -12 z" fill="url(#mapGrad)"/>
  </g>
  <text x="52" y="147" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <text x="78" y="118" font-size="13.5" font-weight="700" fill="#2b2b3a">Accessible Match Day</text>
  <text x="78" y="136" font-size="13.5" font-weight="700" fill="#2b2b3a">Shuttle Station</text>
  <text x="78" y="156" font-size="10.5" fill="#8a8a9a">pickup point</text>
  <text x="78" y="172" font-size="10.5" fill="#8a8a9a">near ID/Chinatown Station</text>

  <!-- ===================== NODE 2 ===================== -->
  <g filter="url(#soft)">
    <rect x="380" y="92" width="232" height="102" rx="12" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.4"/>
    <path d="M380 104 a12 12 0 0 1 12 -12 h24 v102 h-24 a12 12 0 0 1 -12 -12 z" fill="url(#mapGrad)"/>
  </g>
  <text x="398" y="149" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="424" y="118" font-size="13.5" font-weight="700" fill="#2b2b3a">Stadium ADA Drop-off</text>
  <text x="424" y="137" font-size="10.5" fill="#8a8a9a">S Charles St &amp; Occidental Ave S</text>
  <text x="424" y="153" font-size="10.5" fill="#8a8a9a">south entrance · by the Pro Shop</text>
  <text x="424" y="173" font-size="10" fill="#c05a86" font-style="italic">ride-shares w/ accessibility only</text>

  <!-- ===================== NODE 3 ===================== -->
  <g filter="url(#soft)">
    <rect x="720" y="92" width="226" height="92" rx="12" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.4"/>
    <path d="M720 104 a12 12 0 0 1 12 -12 h24 v92 h-24 a12 12 0 0 1 -12 -12 z" fill="url(#mapGrad)"/>
  </g>
  <text x="738" y="146" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <text x="764" y="118" font-size="13.5" font-weight="700" fill="#2b2b3a">Outside Stadium Entrance</text>
  <text x="764" y="137" font-size="10.5" fill="#8a8a9a">security &amp; wheelchair escort</text>
  <text x="764" y="157" font-size="10" fill="#c05a86" font-style="italic">45+ min wait · 4-org handoff</text>

  <!-- ===================== LEGEND (left gap) ===================== -->
  <g transform="translate(34,222)">
    <rect x="0" y="0" width="250" height="104" rx="12" fill="#ffffff" stroke="rgba(120,110,200,0.28)"/>
    <text x="16" y="26" font-size="12" font-weight="700" fill="#5a4a8a">Legend / 图例</text>
    <line x1="16" y1="46" x2="56" y2="46" stroke="#2f6fd6" stroke-width="3.4" marker-end="url(#arrEntry)"/>
    <text x="66" y="50" font-size="11" fill="#4a4a58">Entry 进场 · 1 → 2 → 3 → 4</text>
    <line x1="16" y1="70" x2="56" y2="70" stroke="#e0559b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrExit)"/>
    <text x="66" y="74" font-size="11" fill="#4a4a58">Exit 离场 · 4 → 2 → 1</text>
    <circle cx="26" cy="92" r="9" fill="url(#mapGrad)"/>
    <text x="26" y="96" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">#</text>
    <text x="66" y="96" font-size="11" fill="#4a4a58">A stop on the ADA journey</text>
  </g>

  <!-- compass (north-up) -->
  <g transform="translate(262,352)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="rgba(120,110,200,0.35)"/>
    <path d="M0 -11 L5 3 L0 -1 L-5 3 Z" fill="#e0559b"/>
    <text x="0" y="14" font-size="8" font-weight="700" fill="#5a4a8a" text-anchor="middle">N</text>
  </g>

  <!-- ===================== NODE 4: Seattle Stadium (Lumen Field), north-up ===================== -->
  <g filter="url(#soft)">
    <rect x="300" y="346" width="380" height="268" rx="44" fill="url(#bowlGrad)" stroke="#c7cfda" stroke-width="1.5"/>
  </g>
  <rect x="326" y="372" width="328" height="216" rx="34" fill="#eef2f7" stroke="#d7dde6"/>
  <rect x="352" y="398" width="276" height="164" rx="22" fill="#ffffff" stroke="#d7dde6"/>
  <!-- pitch (long axis horizontal; goals left/right; north sideline = top edge) -->
  <rect x="404" y="430" width="172" height="100" rx="8" fill="url(#pitchGrad)"/>
  <line x1="490" y1="430" x2="490" y2="530" stroke="#ffffff" stroke-width="1.3" opacity="0.85"/>
  <circle cx="490" cy="480" r="13" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85"/>
  <rect x="404" y="463" width="12" height="34" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
  <rect x="564" y="463" width="12" height="34" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.75"/>
  <!-- faint sideline labels for orientation -->
  <text x="490" y="556" font-size="11.5" font-weight="700" fill="#5a4a8a" text-anchor="middle">SEATTLE STADIUM · sold-out 66,925</text>

  <!-- seat marker: north (Cascade) sideline, right of midfield (section 112 area) — no specifics -->
  <g transform="translate(536,414)">
    <circle cx="0" cy="0" r="13" fill="url(#mapGrad)" filter="url(#soft)"/>
    <text x="0" y="5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">4</text>
  </g>
  <g>
    <rect x="500" y="384" width="72" height="17" rx="8" fill="#ffffff" fill-opacity="0.92"/>
    <text x="536" y="397" font-size="11" font-weight="700" fill="#2b2b3a" text-anchor="middle">My Seat</text>
  </g>

  <!-- SoDo label -->
  <text x="690" y="636" font-size="12" fill="#b9c0cc" font-style="italic" text-anchor="middle">SoDo · south of Downtown Seattle</text>
</svg>
