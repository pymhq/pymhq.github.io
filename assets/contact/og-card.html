<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ============================================================
     Social preview card — pengandy.com/contact — 1200×630.

     Content comes from the closing slide (25) of the UW CSE seminar
     deck: kicker, "Pick a time, or send a note", the channels.
     The styling comes from the site, not the deck — every value
     below is lifted from assets/css/shell.css so the card reads as
     a crop of contact.html rather than a slide export:

       h1        shell.css h1–h4: --serif, font-weight 400,
                 letter-spacing -.02em  (NOT bold — the site has no
                 700-weight display type anywhere)
       .eyebrow  --ink-3, .16em tracking, uppercase, 600
       .lede     .page-lede: --serif, --ink-2
       .mail     .contact-mail: --serif, -.02em, hairline underline
       .btn      .btn: 1px solid --ink, weight 500, sans
       rhythm    generous negative space, per --movement

     Blue appears once, on the CTA arrow: on the site --accent is an
     interaction colour (links, nav underline, focus) and is never
     used to tint display type. The deck's gold/lavender, the bold
     headline, the coloured phrase and the short accent rule of the
     first draft are all gone for that reason.

     No page title, no author name, no bare domain: LinkedIn/Twitter
     render those beneath the image.

     RENDER AT 1x — 1200x630, --force-device-scale-factor=1.
     OG-CARD-SOP.md asks for a 3x render (3600x1890). That is wrong for
     LinkedIn: 1200x630 is the size it renders the card at, so a 3x
     asset gets put through its server-side resizer and JPEG encoder,
     and 400-weight serif plus the 19px handles row come back visibly
     soft. Handing it the exact size means no resampling at all. 1200px
     also covers retina: the desktop feed card is ~552 CSS px and a
     phone is ~390 CSS px at DPR 3 = ~1170 device px.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
  :root {
    --ink: #16181d;          /* shell.css --ink */
    --ink-2: #3c4148;        /* shell.css --ink-2 */
    --ink-3: #6b7280;        /* shell.css --ink-3 */
    --paper: #ffffff;        /* shell.css --paper */
    --accent: #0076df;       /* shell.css --accent */
    --rule: rgba(22, 24, 29, .18);       /* shell.css --rule-2 */
    --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica,
      Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-size: 17px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .eyebrow .sep { opacity: .55; margin: 0 11px; }

  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 78px; line-height: 1.04; letter-spacing: -.02em;
    margin-top: 26px;
  }

  .lede {
    font-family: var(--serif); font-size: 28px; line-height: 1.42;
    color: var(--ink-2); margin-top: 30px; max-width: 900px;
  }
  .lede .sep { color: var(--ink-3); opacity: .6; margin: 0 9px; }

  .actions {
    display: flex; align-items: center; gap: 40px; margin-top: 52px;
  }
  .btn {
    font-size: 21px; font-weight: 500; color: var(--ink);
    border: 1px solid var(--ink); padding: 16px 32px;
  }
  .btn .arrow { color: var(--accent); }
  .mail {
    font-family: var(--serif); font-size: 30px; letter-spacing: -.02em;
    color: var(--ink); border-bottom: 1px solid var(--rule);
    padding-bottom: 5px;
  }

  /* mirrors .contact-social: a quiet sans row of handles, no underlines */
  .social {
    display: flex; gap: 30px; margin-top: 46px;
    font-size: 19px; color: var(--ink-3);
  }
  .social b { font-weight: 600; color: var(--ink-2); margin-right: 9px; }
</style>
</head>
<body>

  <p class="eyebrow">Contact<span class="sep">·</span>Coffee chats &amp; casual conversations</p>

  <h1>Pick a time,<br>or send a note.</h1>

  <p class="lede">Research<span class="sep">·</span>Career<span class="sep">·</span>Startups<span class="sep">·</span>Executive<span class="sep">·</span>Org &amp; culture<span class="sep">·</span>Writing</p>

  <div class="actions">
    <span class="btn">Book a coffee chat <span class="arrow">&rarr;</span></span>
    <span class="mail">pengandy.build@gmail.com</span>
  </div>

  <p class="social">
    <span><b>LinkedIn</b>/in/pengandy-us</span>
    <span><b>X &middot; GitHub</b>@pymhq</span>
    <span><b>Substack</b>@pengandy</span>
  </p>

</body>
</html>
