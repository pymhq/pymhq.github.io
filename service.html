   <style>
      /* Service page specific styles */
      .post-description {
        font-size: 1.25rem;
      }

      /* Leading pill TOC, same design as the Books & Publications page */
      html {
        scroll-behavior: smooth;
      }

      .pub-toc {
        position: sticky;
        top: 58px;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 0;
        background: var(--global-bg-color);
      }

      .pub-toc a {
        display: inline-block;
        padding: 5px 14px;
        border: 1px solid var(--global-divider-color);
        border-radius: 16px;
        font-size: 0.85rem;
        color: var(--global-text-color);
        text-decoration: none !important;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .pub-toc a:hover {
        border-color: var(--global-theme-color);
        color: var(--global-theme-color);
      }

      .pub-toc a.active {
        background: var(--global-theme-color);
        border-color: var(--global-theme-color);
        color: #fff;
      }

      .pub-toc a.active span {
        color: #fff;
      }

      @media (max-width: 768px) {
        .pub-toc {
          overflow-x: auto;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
        }
      }

      /* anchor targets shouldn't hide under fixed navbar + sticky TOC */
      .service-block {
        scroll-margin-top: 130px;
      }

      /* ============================================================
         Service — modern tag-forward layout.
         Card box restored (matches every other .card on the site).
         Inside: each role is a bold label, followed by entries.
         The venue/organization name is the identity of each entry,
         so it becomes a small pill/tag; the surrounding context
         (role, track, year) stays as plain supporting text next
         to it. This creates real visual texture instead of a flat
         list, while staying restrained — tags are small, muted,
         not loud colored buttons.
         ============================================================ */

      .service-block {
        padding: 1.5rem 0;
        border-bottom: 1px solid var(--global-divider-color);
      }
      .service-block:last-child { border-bottom: none; padding-bottom: .25rem; }
      .service-block:first-of-type { padding-top: .25rem; }

      .service-block .role-label {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0 0 .8rem;
      }

      .venue-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .venue-list li {
        font-size: 1.05rem;
        line-height: 1.85;
        margin: 0 0 .65rem;
        color: var(--global-text-color);
      }
      .venue-list li:last-child { margin-bottom: 0; }

      /* the tag: venue/org name — same pill language as the pub-toc
         and the category chips on the Projects page */
      .venue-tag {
        display: inline-block;
        font-size: .85rem;
        font-weight: 400;
        color: var(--global-text-color);
        background: transparent;
        border: 1px solid var(--global-divider-color);
        border-radius: 16px;
        padding: 5px 14px;
        margin-right: .5rem;
        line-height: 1.5;
      }

      .venue-detail {
        color: var(--global-text-color-light);
      }
      .venue-detail a {
        color: var(--global-text-color-light);
        text-decoration: underline;
        text-decoration-color: var(--global-divider-color);
      }
      .venue-detail a:hover {
        color: var(--global-theme-color);
        text-decoration-color: var(--global-theme-color);
      }
   </style>

      <script>
         // TOC active-section highlighting. Sections live in the fetched
         // component, so resolve them lazily on each scroll tick.
         (function() {
           var links = document.querySelectorAll('#svc-toc a');
           function refresh() {
             var fromTop = window.scrollY + 140;
             var current = 0, found = false;
             links.forEach(function(a, i) {
               var sec = document.querySelector(a.getAttribute('href'));
               if (sec && sec.offsetTop <= fromTop) { current = i; found = true; }
             });
             links.forEach(function(a, i) {
               a.classList.toggle('active', found && i === current);
             });
           }
           window.addEventListener('scroll', refresh, { passive: true });
           window.addEventListener('load', refresh);
         })();
      </script>
      <script>

         // Transient GitHub Pages 5xx errors used to leave this section
         // blank until a manual refresh; check status and retry instead.
         function fetchRetry(url, tries) {
            return fetch(url).then(function(r) {
               if (!r.ok) throw new Error(url + ': ' + r.status);
               return r.text();
            }).catch(function(e) {
               if (tries <= 1) throw e;
               // fast first retry (300ms), longer second (600ms)
               return new Promise(function(res) { setTimeout(res, (4 - tries) * 300); })
                  .then(function() { return fetchRetry(url, tries - 1); });
            });
         }
         // Load service content directly
         (function() {
           // First create the card structure (without title to avoid duplication with page title)
           const placeholder = document.getElementById('service-placeholder');
           if (placeholder) {
             placeholder.innerHTML = `
               <div class="card mt-3 p-3">
                 <div id="service-content-placeholder"></div>
               </div>
             `;
             
             // Then load the actual content (with cache busting)
             fetchRetry('/components/service-content.html?v=20260718', 3)
               .then(html => {
                 const contentPlaceholder = document.getElementById('service-content-placeholder');
                 if (contentPlaceholder) {
                   contentPlaceholder.innerHTML = html;
                 }
               });
           }
         })();
