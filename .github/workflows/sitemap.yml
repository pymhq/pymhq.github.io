name: Generate sitemap

# Regenerates sitemap.html whenever any page (or the generator itself)
# changes. The commit made here carries [skip ci], so it does not
# retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/index.html"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/sitemap.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-sitemap
  cancel-in-progress: false

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.html
        run: python3 scripts/generate_sitemap.py

      - name: Commit sitemap.html if changed
        run: |
          if [[ -n "$(git status --porcelain sitemap.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.html
            git commit -m "chore: regenerate sitemap.html [skip ci]"
            git push
          else
            echo "sitemap.html already up to date; nothing to commit."
          fi
